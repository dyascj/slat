[package]
name = "slat"
version = "1.1.3"
edition = "2024"
description = "A fast, minimal scrolling tiling window manager for macOS."
license = "MIT"
repository = "https://github.com/dyascj/slat"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
winit = { version = "0.30", default-features = false }
tray-icon = "0.26"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-service-management = "0.3"
dispatch2 = "0.3"
block2 = "0.6"
signal-hook = "0.4"
minisign-verify = "0.3"

[dev-dependencies]
toml = "1.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
