[package]
name = "slat"
version = "1.0.0"
edition = "2024"
description = "A fast, minimal scrolling tiling window manager for macOS."
license = "MIT"
repository = "https://github.com/dyascj/slat"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"

[dev-dependencies]
toml = "1.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
