name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: App
        run: |
          cd app
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      # One test at a time: on the hosted runner the parallel run aborts now
      # and then (SIGABRT, no test named), while serial runs pass every time.
      - name: Engine
        run: |
          cd engine
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test -- --test-threads=1
