# Generated by Slat. Edits are overwritten; enable custom config mode to edit by hand.

[options]
focus_follows_mouse = false
mouse_follows_focus = false
preset_column_widths = [0.5, 0.66, 1.0]
auto_center = false
animation_speed = 18.0
create_virtual_workspace_automatically = false

[padding]
top = 4
bottom = 4
left = 4
right = 4

[swipe]
sensitivity = 0.35

[swipe.gesture]
fingers_count = 4
direction = "Natural"
vertical = true

[swipe.scroll]
modifier = "alt"

[decorations]
workspace_menu_status = false

[decorations.active.border]
enabled = false

[bindings]
window_focus_west = ["alt - h", "alt - leftarrow"]
window_focus_east = ["alt - l", "alt - rightarrow"]
window_focus_north = ["alt - k", "alt - uparrow"]
window_focus_south = ["alt - j", "alt - downarrow"]
window_swap_west = ["alt + shift - h", "alt + shift - leftarrow"]
window_swap_east = ["alt + shift - l", "alt + shift - rightarrow"]
window_swap_north = ["alt + shift - k", "alt + shift - uparrow"]
window_swap_south = ["alt + shift - j", "alt + shift - downarrow"]
window_resize = "alt - r"
window_shrink = "alt + shift - r"
window_center = "alt - c"
window_fullwidth = "alt - f"
window_manage = "alt - t"
window_tabbeddisplay = "alt + shift - t"
window_stack_west = "alt - leftbracket"
window_stack_east = "alt - rightbracket"
window_unstack_west = "alt + shift - leftbracket"
window_unstack_east = "alt + shift - rightbracket"
window_nextdisplay = "alt - n"
window_virtualnum_1 = "alt - 1"
window_virtualnum_2 = "alt - 2"
window_virtualnum_3 = "alt - 3"
window_virtualnum_4 = "alt - 4"
window_virtualmovenum_1 = "alt + shift - 1"
window_virtualmovenum_2 = "alt + shift - 2"
window_virtualmovenum_3 = "alt + shift - 3"
window_virtualmovenum_4 = "alt + shift - 4"

[windows.slat_default_width]
title = ".*"
width = 0.5

[windows.slat_gaps]
title = ".*"
horizontal_padding = 4
vertical_padding = 4
